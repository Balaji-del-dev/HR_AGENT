[project]
name = "hr-platform"
version = "0.1.0"
description = "HR Recruiter Agent Platform: Django API, Celery workers and the LangGraph agent engine"
authors = [
    { name = "Balaji-del-dev", email = "mrbalamurugan818@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.7.0",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "django>=6.1,<6.2",
    "django-axes>=9.0.0",
    "django-celery-beat>=2.1.0",
    "django-csp>=4.0",
    "django-filter>=26.2",
    "django-stubs-ext>=6.1.2",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "en-core-web-sm",
    "jinja2>=3.1.6",
    "langchain>=1.0",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.0",
    "langchain-ollama>=1.1.0",
    "langfuse>=5.2.0",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.2.1",
    "pillow>=13.0.0",
    "presidio-analyzer>=2.2.366",
    "presidio-anonymizer>=2.2.366",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.12",
    "pymupdf>=2.1",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-magic>=0.4.27",
    "redis>=8.1.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "daphne>=4.2.3",
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.2",
    "factory-boy>=3.3.3",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--strict-markers -ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "BLE", "RUF"]
ignore = [
    "S101",    # assert is how pytest works
    "RUF012",  # Django Meta / DRF class attributes are lists by convention
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]  # fixture passwords

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "agent_engine", "document_ai", "policies", "evals"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = ["celery.*", "channels.*", "django_filters.*", "factory.*", "pytesseract.*", "magic.*", "pymupdf.*", "docx.*", "presidio_analyzer.*", "langfuse.*", "daphne.*", "django_celery_beat.*", "axes.*", "csp.*", "jinja2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# factory_boy returns untyped objects, so strict checking of tests is all noise.
# Tests are verified by running them.
module = ["apps.*.tests.*", "agent_engine.tests.*", "document_ai.tests.*", "policies.tests.*", "evals.tests.*", "conftest"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[[tool.mypy.overrides]]
# mypy crashes analysing this LangChain module (INTERNAL ERROR); its types are not needed here.
module = ["langchain.agents.middleware.todo"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# Celery's shared_task decorator is untyped.
module = ["apps.*.tasks", "agent_engine.tasks"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# LangGraph's add_node overloads do not cover nodes taking (state, runtime, config); runtime tests cover these.
module = ["agent_engine.graphs.*"]
disable_error_code = ["arg-type", "return-value"]
